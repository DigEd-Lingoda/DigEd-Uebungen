<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schreibübung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        textarea:focus {
            border-color: #153BFF;
        }
        textarea:disabled {
            background-color: #edf2f7;
            color: #718096;
            cursor: not-allowed;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-submit {
            background-color: #48bb78;
            color: white;
        }
        .btn-submit:hover {
            background-color: #38a169;
        }
        .btn-submit:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        .btn-reset {
            background-color: #a0aec0;
            color: white;
        }
        .btn-reset:hover {
            background-color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <textarea id="user-text" placeholder="Schreibe deinen Text hier..."></textarea>

    <div class="buttons">
        <button class="btn-submit" id="submit-btn" onclick="submitTask()">Abgeben</button>
        <button class="btn-reset" id="reset-btn" onclick="resetTask()">Zurücksetzen</button>
    </div>
</div>

<script>
    const userText = document.getElementById('user-text');
    const submitBtn = document.getElementById('submit-btn');

    function submitTask() {
        userText.disabled = true;
        submitBtn.disabled = true;
    }

    function resetTask() {
        userText.disabled = false;
        submitBtn.disabled = false;
        userText.value = '';
        userText.focus();
    }
</script>

</body>
</html>
