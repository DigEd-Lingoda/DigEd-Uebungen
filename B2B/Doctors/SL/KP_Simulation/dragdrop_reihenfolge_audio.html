    audio {

    .drag-item.correct {

    .drag-item.incorrect {

    .controls {

    button.check-btn {

    #result {

  <script>
    const correctSolutions = {
      "1": { correctPos: 0, correctTitle: "Vorstellung der eigenen Person & Gesprächseinleitung" },
      "2": { correctPos: 1, correctTitle: "Patientendaten / Identitätsabgleich" },
      "3": { correctPos: 2, correctTitle: "Aktuelle Anamnese (Einstieg / Leitsymptom)" },
      "4": { correctPos: 3, correctTitle: "Aktuelle Anamnese (Schmerzpräzisierung / OPQRST)" },
      "5": { correctPos: 4, correctTitle: "Vegetative Anamnese" },
      "6": { correctPos: 5, correctTitle: "Medizinische Vorgeschichte (Eigenanamnese)" },
      "7": { correctPos: 6, correctTitle: "Medikamentenanamnese" },
      "8": { correctPos: 7, correctTitle: "Allergien & Unverträglichkeiten" },
      "9": { correctPos: 8, correctTitle: "Noxen" },
      "10": { correctPos: 9, correctTitle: "Familienanamnese (mit Überleitung)" },
      "11": { correctPos: 10, correctTitle: "Sozialanamnese" }
    };

    const list = document.getElementById('audio-list');
    let draggedItem = null;

    list.addEventListener('dragstart', (e) => {
      if (e.target.classList.contains('drag-item')) {
        draggedItem = e.target;
        e.target.classList.add('dragging');
      }
    });

    list.addEventListener('dragend', (e) => {
      if (e.target.classList.contains('drag-item')) {
        e.target.classList.remove('dragging');
        draggedItem = null;
      }
    });

    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(list, e.clientY);
      if (afterElement == null) {
        list.appendChild(draggedItem);
      } else {
        list.insertBefore(draggedItem, afterElement);
      }
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.drag-item:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function checkOrderAndTitles() {
      const items = [...list.querySelectorAll('.drag-item')];
      let correctCount = 0;
      const totalItems = items.length;

      items.forEach((item, index) => {
        const id = item.dataset.id;
        const selectedTitle = item.querySelector('.title-select').value;
        const solution = correctSolutions[id];

        const isPositionCorrect = index === solution.correctPos;
        const isTitleCorrect = selectedTitle === solution.correctTitle;

        if (isPositionCorrect && isTitleCorrect) {
          item.classList.add('correct');
          item.classList.remove('incorrect');
          correctCount++;
        } else {
          item.classList.add('incorrect');
          item.classList.remove('correct');
        }
      });

      const resultEl = document.getElementById('result');
      if (correctCount === totalItems) {
        resultEl.style.color = '#28a745';
        resultEl.textContent = 'Hervorragend! Alle 11 Abschnitte sind in der richtigen Reihenfolge und korrekt benannt.';
      } else {
        resultEl.style.color = '#dc3545';
        resultEl.textContent = `${correctCount} von ${totalItems} Karten sind vollständig richtig. Überprüfe Position und Zuordnung!`;
      }
    }
  </script>

</body>
</html>
